# Runtime 0.9. Exact profiles preferred; generic requires a recognized driver shape.
enabled=1
generic=1
dongles=2
port=8420
players_per_pad=1
stale_ms=45000
# A pad gets the lowest free player slot; phone slots use the same pool.
# Optional fixed targets: 0=first free, 1..8=handset, off=ignore this half.
pad.1.right=1
pad.2.right=2
map.right.red=r1|r2
map.right.blue=triangle
map.right.orange=square
map.right.green=circle
map.right.yellow=cross
# In two-player mode the second player uses the D-pad and left shoulder.
map.left.red=l1|l2
map.left.blue=up
map.left.orange=left
map.left.green=right
map.left.yellow=down
