name: lint
on: [push, pull_request]
jobs:
  syntax-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile server/app.py server/gamepad.py server/gamepad_windows.py
