name: pcsx2-lint
on:
  push:
    paths: ["pcsx2/**", ".github/workflows/pcsx2-lint.yml"]
  pull_request:
    paths: ["pcsx2/**", ".github/workflows/pcsx2-lint.yml"]
jobs:
  syntax-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pcsx2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile server/app.py server/gamepad.py server/gamepad_windows.py
